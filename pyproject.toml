[project]
name = "mcp-web-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "mcp>=1.27.0",
    "ollama>=0.6.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "tavily-python>=0.7.23",
]

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "ruff>=0.15.10",
]

[project.scripts]
mcp-server = "mcp_web_search.server:main"
mcp-cli = "mcp_web_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavily_search"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [ "E", "F", "I", "UP" ]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingSubTypes = false
